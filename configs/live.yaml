# live.yaml — bounded-live envelope (AGENTS.md Sections 2, 27, 35).
#
# These caps bound the FIRST live orders to a small, recoverable footprint even after
# every gate passes and an operator signs off. They are an extra belt-and-suspenders on
# top of the immutable risk envelope (Section 17) — not a replacement for it. Live order
# placement is refused unless ALL of these hold (LiveActivationGuard):
#   * settings.live_trading_allowed (TRADING_MODE=LIVE + APP_ENV=production + ENABLE_LIVE_TRADING=true)
#   * every blocks_live gate currently PASSes (Road to Live = 100%)
#   * an APPROVED live_activation sign-off exists (a second operator)
#   * the per-order / per-session caps below are not exceeded.

version: 1

live:
  max_orders_per_session: 5      # hard cap on live entries before a manual review
  max_open_positions: 2          # concurrent live positions
  max_order_notional_pct: 0.05   # ≤ 5% of equity notional per order
  account_equity: 10000.0        # reference equity for notional caps until a live balance is read

# basket_demo — the cross-sectional (carry/factor) DEMO path (src/live/basket_exec.py).
#
# A basket runs dollar-neutral and exits on the rebalance cadence, so it deliberately carries NO
# protective stop between rebalances (a stop knifes the hedge and leaves the other legs naked).
# On a REAL venue that collides with Section 2.2 (a position must never sit unprotected), so each
# leg gets a deliberately-WIDE disaster stop instead: far outside normal basket behaviour, but it
# bounds the loss if this process dies with legs open. These caps apply to demo/testnet only —
# real-money live is authorised by the LiveActivationGuard above and nothing here loosens it.
basket_demo:
  disaster_stop_frac: 0.25       # exchange-resident stop this far adverse per leg (0 = none)
  max_gross_pct: 0.50            # basket gross notional ≤ 50% of REAL account equity
  min_account_equity: 100.0      # refuse to start below this demo balance (dust legs)
  require_flat_book: true        # refuse to start unless the demo account is flat (Section 7)
