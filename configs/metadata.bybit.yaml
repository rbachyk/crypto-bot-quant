# metadata.bybit.yaml — Bybit USDT-perpetual contract metadata (Section 6).
#
# Per-venue metadata used when EXCHANGE_ID=bybit (demo / testnet / live). Covers the FULL
# configs/data.bybit.yaml universe (20 symbols) so account partitioning works: whichever symbols
# a strategy trades on a shared account, its metadata is present here (Section 17).
#
# PROVENANCE: every field below was fetched from Bybit's v5 /market/instruments-info (mainnet
# public API — the same reference api-demo.bybit.com serves) via ccxt on 2026-07-25:
#   tick_size          <- priceFilter.tickSize
#   qty_step/lot_size  <- lotSizeFilter.qtyStep
#   min_order_size     <- lotSizeFilter.minOrderQty
#   min_notional       <- lotSizeFilter.minNotionalValue
#   max_leverage       <- leverageFilter.maxLeverage
#   funding_interval   <- fundingInterval (minutes -> hours)
#   maker_fee/taker_fee<- ccxt unified maker/taker = Bybit DEFAULT (VIP0) 0.0001 / 0.0006
#
# STILL `verified: false` — this is FETCHED DATA, NOT an operator sign-off. The venue REFUSES all
# orders and demo-readiness reports BLOCKED until an operator confirms and flips it. On the VPS:
#   1. Spot-check these against Bybit's contract page for the target environment. The values are
#      the venue defaults; the ONE thing to confirm for YOUR account is the fee TIER — maker/taker
#      here are VIP0 (0.0001 / 0.0006); if your demo account differs, correct maker_fee/taker_fee
#      (a basket pays taker on every non-passive leg, so this drives the cost model).
#   2. Set `verified_at` to the ISO timestamp, `verified_against` to your reference, and flip
#      `verified: true`. (metadata_version already bumped to _0002 for this data change.)
# Re-check with: python scripts/verify_metadata.py    (diffs this file vs the live venue)
# Any metadata change => new version => re-verification.

